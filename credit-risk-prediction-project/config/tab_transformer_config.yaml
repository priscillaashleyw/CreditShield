paths:
  raw_data: "kaggle://wordsforthewise/lending-club/accepted_2007_to_2018Q4.csv"

data_settings:
  essential_columns:
    - loan_amnt
    - int_rate
    - annual_inc
    - dti
    - delinq_2yrs
    - inq_last_6mths
    - open_acc
    - pub_rec
    - revol_bal
    - total_acc
    - collections_12_mths_ex_med
    - acc_now_delinq
    - tot_coll_amt
    - tot_cur_bal
    - total_rev_hi_lim
    - term
    - loan_status
    - issue_d
  
  years: [2013, 2014]
  incomplete_statuses: [Current]
  leaked_columns:
    - funded_amnt
    - funded_amnt_inv
    - recoveries
    - collection_recovery_fee
    - last_pymnt_d
    - last_pymnt_amnt
    - next_pymnt_d

target_settings:
  business:
    default_statuses: ["Charged Off", "Default"]
    good_statuses: ["Fully Paid"]

# TUNED MODEL PARAMETERS
model:
  embedding_dim: 32
  depth: 4
  heads: 4
  dim_head: 32
  mlp_dim: 256
  dropout: 0.2

# TUNED TRAINING PARAMETERS
batch_size: 128
epochs: 100
learning_rate: 0.0005
early_stopping_patience: 15
weight_decay: 0.01

numerical_features: []
categorical_features: []
